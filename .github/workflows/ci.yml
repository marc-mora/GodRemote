# Compila y prueba GodRemote en Windows, Linux y macOS, y publica los
# ejecutables como «Release» al empujar una etiqueta vX.Y.Z.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ejecutables:
        description: "Compilar también los ejecutables de las tres plataformas"
        type: boolean
        default: true

permissions:
  contents: read

# Una ejecución completa tarda: la que ya está en marcha termina, y de las
# que esperan solo se queda la más reciente. Las pedidas a mano van aparte,
# para que una subida no las descarte.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # La misma versión de Rust con la que se desarrolla.
  RUST_VERSION: "1.97.0"
  # En Windows, las rutinas en ensamblador de la librería criptográfica
  # vienen ya ensambladas: no hace falta instalar NASM.
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  # Linux: formato, avisos y todas las pruebas, incluidas las que necesitan
  # servidores reales (sshd, telnetd, x11vnc, FreeRDP…) y permisos de root.
  linux:
    name: Linux (con servidores reales)
    runs-on: ubuntu-latest
    # Una prueba colgada no debe tener la cola parada durante horas.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            reforzado/target
          key: linux-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'reforzado/Cargo.lock') }}
          restore-keys: linux-${{ env.RUST_VERSION }}-
      - name: Servidores y clientes de prueba
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openssh-server xvfb xauth x11-apps x11-utils xterm x11vnc socat telnetd procps
          # El servidor RDP de pruebas no está en todas las versiones de Ubuntu:
          # sin él, su prueba se omite sola.
          sudo apt-get install -y --no-install-recommends freerdp3-shadow-x11 || true
          # Aplicaciones GTK, Qt, Tk, Motif y Java con las que se prueba el
          # servidor X propio. Igual: la que falte solo omite su prueba.
          sudo apt-get install -y --no-install-recommends \
            xdotool wmctrl x11-xserver-utils yad gtk-3-examples adwaita-icon-theme \
            fonts-dejavu-core tk nedit python3-pyqt5 openjdk-21-jdk \
            gtk-4-examples zenity || true
      - name: Formato
        run: cargo fmt --check
      - name: Pruebas, edición completa
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test --locked
      - name: Pruebas, edición SSH reforzada
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test --locked --manifest-path reforzado/Cargo.toml
      # La consulta real del aviso de versiones. Depende de la red, así que
      # su fallo no tumba la ejecución (pero queda a la vista).
      - name: Aviso de versión nueva contra github.com
        continue-on-error: true
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test --locked --lib live_query -- --ignored --nocapture
      - name: Devolver los ficheros a su dueño
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . "$HOME/.cargo" || true
      # La aplicación de verdad: se abre, pinta su ventana, guarda una captura
      # y se cierra sola (src/ui/probe.rs).
      - name: Arranque de la aplicación
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/perfil"
          GODREMOTE_HOME="$RUNNER_TEMP/perfil" GODREMOTE_CAPTURA="$PWD/arranque-Linux.png" \
            xvfb-run -a target/debug/godremote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arranque-Linux
          path: arranque-Linux.png
          if-no-files-found: ignore
      - name: Avisos (clippy), edición completa
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Avisos (clippy), edición SSH reforzada
        run: cargo clippy --locked --all-targets --manifest-path reforzado/Cargo.toml -- -D warnings

  # Windows y macOS: compilación nativa y las pruebas que no dependen de
  # servidores de Unix.
  escritorio:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
          - os: macos-latest
            nombre: macOS
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'reforzado/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Pruebas, edición completa
        run: cargo test --locked
      # La aplicación de verdad: se abre, pinta su ventana, guarda una captura
      # y se cierra sola (src/ui/probe.rs).
      - name: Arranque de la aplicación
        shell: bash
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/perfil"
          GODREMOTE_HOME="$RUNNER_TEMP/perfil" GODREMOTE_CAPTURA="$PWD/arranque-${{ runner.os }}.png" \
            "target/debug/godremote${{ runner.os == 'Windows' && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arranque-${{ runner.os }}
          path: arranque-${{ runner.os }}.png
          if-no-files-found: ignore
      - name: Compila la edición SSH reforzada
        run: cargo check --locked --all-targets --manifest-path reforzado/Cargo.toml --target-dir target

  # Ejecutables nativos de las dos ediciones y sus paquetes. Solo al etiquetar
  # una versión o al pedirlo a mano.
  ejecutables:
    name: Ejecutables (${{ matrix.nombre }})
    # Con una etiqueta de versión, al pedirlo a mano, o en cualquier subida
    # cuyo mensaje lleve la marca «[ejecutables]».
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.ejecutables)
      || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ejecutables]'))
    needs: [linux, escritorio]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          # Una versión antigua de Ubuntu a propósito: el ejecutable sirve en
          # cualquier distribución con una glibc igual o más nueva.
          - os: ubuntu-22.04
            nombre: linux
          - os: macos-latest
            nombre: macos
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          # En macOS se compila para los dos procesadores (binario universal).
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ejecutables-${{ matrix.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'reforzado/Cargo.lock') }}
          restore-keys: ejecutables-${{ matrix.os }}-${{ env.RUST_VERSION }}-
      - name: Librerías para probar el arranque (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2
      - name: Compila las dos ediciones
        shell: bash
        run: |
          mkdir -p binarios
          compila() {  # compila [--target T]: las dos ediciones
            cargo build --release --locked "$@"
            cargo build --release --locked --manifest-path reforzado/Cargo.toml --target-dir target "$@"
          }
          if [ "${{ runner.os }}" = "macOS" ]; then
            for destino in aarch64-apple-darwin x86_64-apple-darwin; do
              compila --target "$destino"
            done
            for nombre in godremote godremote-reforzado; do
              lipo -create -output "binarios/$nombre" \
                "target/aarch64-apple-darwin/release/$nombre" "target/x86_64-apple-darwin/release/$nombre"
              lipo -info "binarios/$nombre"
            done
          else
            compila
            ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
            cp "target/release/godremote$ext" "target/release/godremote-reforzado$ext" binarios/
          fi
          ls -l binarios
      # Los ejecutables que se van a publicar, de verdad: se abren, pintan su
      # ventana, guardan una captura y se cierran (src/ui/probe.rs).
      - name: Arranque de los ejecutables
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p capturas
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          lanzador=""
          if [ "${{ runner.os }}" = "Linux" ]; then lanzador="xvfb-run -a"; fi
          for nombre in godremote godremote-reforzado; do
            mkdir -p "$RUNNER_TEMP/perfil-$nombre"
            GODREMOTE_HOME="$RUNNER_TEMP/perfil-$nombre" \
              GODREMOTE_CAPTURA="$PWD/capturas/$nombre-${{ matrix.nombre }}.png" \
              $lanzador "binarios/$nombre$ext"
          done
          ls -l capturas
      - name: Empaqueta
        shell: bash
        run: bash empaquetado/empaquetar.sh "${{ matrix.nombre }}" binarios dist
      - uses: actions/upload-artifact@v4
        with:
          name: GodRemote-${{ matrix.nombre }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arranque-ejecutables-${{ matrix.nombre }}
          path: capturas/*
          if-no-files-found: ignore

  # Publica la versión con sus ejecutables. Si la Release ya existe (creada a
  # mano en GitHub junto con la etiqueta) se le añaden; si no, se crea. Las
  # notas salen de docs/versiones/vX.Y.Z.md, si existe. Un ejecutable ya
  # publicado no se sustituye: el paso falla.
  release:
    name: Publicar la versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ejecutables
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: publicar
          pattern: GodRemote-*
          merge-multiple: true
      - name: Sumas SHA-256
        run: |
          cd publicar
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publica los ejecutables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          etiqueta="$GITHUB_REF_NAME"
          notas="docs/versiones/$etiqueta.md"
          ls -l publicar
          if gh release view "$etiqueta" > /dev/null 2>&1; then
            gh release upload "$etiqueta" publicar/*
            # Las notas van delante de lo que ya dijera la descripción
            # (GitHub suele poner el enlace a los cambios), si no están ya.
            if [ -f "$notas" ]; then
              gh release view "$etiqueta" --json body --jq .body > descripcion.md
              if ! grep -qF -- "$(head -n 1 "$notas")" descripcion.md; then
                { cat "$notas"; echo; cat descripcion.md; } > notas-completas.md
                gh release edit "$etiqueta" --notes-file notas-completas.md
              fi
            fi
          else
            opciones=()
            if [ -f "$notas" ]; then
              opciones=(--notes-file "$notas")
            fi
            gh release create "$etiqueta" publicar/* \
              --verify-tag \
              --title "GodRemote ${etiqueta#v}" \
              --generate-notes "${opciones[@]}"
          fi
