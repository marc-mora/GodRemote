# Edición «SSH reforzada» de GodRemote: el mismo código, sin el cliente RDP
# integrado y, gracias a eso, con la última versión de la librería SSH.
#
# Las dependencias del RDP integrado (IronRDP → sspi/picky) fijan versiones
# preliminares de `rsa` que impiden a Cargo elegir russh 0.65.2 o posterior,
# y un Cargo.lock incluye también las dependencias opcionales. La única forma
# de tener las dos combinaciones es con dos manifiestos, cada uno con su
# Cargo.lock. Este comparte el código de `../src`.
#
#   cargo build --release --manifest-path reforzado/Cargo.toml --target-dir target
#
# La lista de dependencias debe ser la del manifiesto principal menos las del
# RDP integrado: lo comprueba la prueba `editions_share_dependencies`.

[package]
name = "godremote"
version = "0.7.0"
edition = "2024"
description = "Gestor de conexiones remotas (edición SSH reforzada, sin RDP integrado)"
license = "MIT"
build = "../build.rs"

[lib]
path = "../src/lib.rs"

# Con otro nombre, para que las dos ediciones puedan convivir en la misma
# carpeta de compilación (`--target-dir target`) y en el mismo equipo.
[[bin]]
name = "godremote-reforzado"
path = "../src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
des = "0.9.0"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.11"
# HMAC y SHA-1 para los códigos TOTP (ya los traía russh).
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
portable-pty = "0.9"
rand = "0.10"
rfd = "0.18.0"
russh = "0.65"
russh-sftp = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
sha1 = "0.11"
sha2 = "0.11.2"
# Lectura de los nombres de los tipos de letra del sistema (ya lo usa egui).
skrifa = "0.44"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "net", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.18"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
# En Windows se pinta con DirectX (wgpu): no depende del controlador de
# OpenGL, que falta en máquinas virtuales y servidores sin tarjeta gráfica.
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std", "parking_lot"] }
# Para leer del registro de Windows si el sistema está en modo oscuro.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[build-dependencies]
# Icono y datos del ejecutable de Windows.
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
# Solo para pruebas: permite EFRAME_SCREENSHOT_TO=archivo.png
screenshot = ["eframe/__screenshot"]

# El código pregunta por `rdp-integrado` y `aviso-versiones`, que esta
# edición no tiene.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("rdp-integrado", "aviso-versiones"))'] }

[[test]]
name = "auth_methods"
path = "../tests/auth_methods.rs"

[[test]]
name = "ssh_integration"
path = "../tests/ssh_integration.rs"

[[test]]
name = "ssh_features"
path = "../tests/ssh_features.rs"

[[test]]
name = "monitor_integration"
path = "../tests/monitor_integration.rs"

[[test]]
name = "vnc_integration"
path = "../tests/vnc_integration.rs"

[[test]]
name = "tunnel_manager"
path = "../tests/tunnel_manager.rs"

[[test]]
name = "xserver_integration"
path = "../tests/xserver_integration.rs"

[[test]]
name = "xserver_ssh"
path = "../tests/xserver_ssh.rs"

[[test]]
name = "sftp_features"
path = "../tests/sftp_features.rs"

[[test]]
name = "fleet"
path = "../tests/fleet.rs"

[[test]]
name = "agent_and_proxy"
path = "../tests/agent_and_proxy.rs"

[[test]]
name = "dashboard"
path = "../tests/dashboard.rs"

[[test]]
name = "ssh_certificates"
path = "../tests/ssh_certificates.rs"

[[test]]
name = "totp_autofill"
path = "../tests/totp_autofill.rs"

[[test]]
name = "security_keys"
path = "../tests/security_keys.rs"

[[test]]
name = "terminal_tools"
path = "../tests/terminal_tools.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
