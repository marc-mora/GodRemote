[package]
name = "godremote"
version = "0.7.0"
edition = "2024"
description = "Gestor de conexiones remotas (SSH, SFTP, RDP) con árbol de equipos y baúl de credenciales"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
des = "0.9.0"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.11"
# HMAC y SHA-1 para los códigos TOTP (ya los traía russh).
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Cliente RDP integrado (IronRDP, Rust puro) con TLS de rustls. Opcional:
# véase la característica `rdp-integrado`.
ironrdp-cliprdr = { version = "0.9", optional = true }
ironrdp-connector = { version = "0.12", optional = true }
ironrdp-core = { version = "0.3", optional = true }
ironrdp-graphics = { version = "0.11", optional = true }
ironrdp-pdu = { version = "0.11", optional = true }
ironrdp-session = { version = "0.13", optional = true }
ironrdp-svc = { version = "0.10", optional = true }
ironrdp-tokio = { version = "0.12", optional = true }
# zlib enlazada estáticamente: `winscard` (vía sspi) la exige y no queremos
# depender de la libz del sistema.
libz-sys = { version = "1", default-features = false, features = ["static"], optional = true }
portable-pty = "0.9"
rand = "0.10"
rfd = "0.18.0"
# OJO: con IronRDP en el árbol, Cargo resuelve russh 0.65.1 (y ssh-key rc.11)
# en lugar de la 0.65.4. sspi y picky, de los que depende ironrdp-connector,
# fijan `rsa = "=0.10.0-rc.18"` y `pkcs1 = "=0.8.0-rc.4"`, mientras que russh
# desde la 0.65.2 exige las versiones finales (rsa 0.10.0), y Cargo no admite
# las dos a la vez. Se pierden así los endurecimientos del cliente SSH de
# russh 0.65.2–0.65.4. En cuanto sspi/picky publiquen versiones sin esa
# fijación bastará con `cargo update -p russh`.
#
# Desactivar `rdp-integrado` no basta para librarse de la fijación: el
# Cargo.lock incluye también las dependencias opcionales. Por eso la edición
# «SSH reforzada» (sin RDP integrado, con russh 0.65.4) tiene su propio
# manifiesto y su propio Cargo.lock en `reforzado/`.
russh = "0.65"
russh-sftp = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
sha1 = "0.11"
sha2 = "0.11.2"
# Lectura de los nombres de los tipos de letra del sistema (ya lo usa egui).
skrifa = "0.44"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.18"
x509-cert = { version = "0.3", default-features = false, features = ["std", "hazmat"], optional = true }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
# En Windows se pinta con DirectX (wgpu): no depende del controlador de
# OpenGL, que falta en máquinas virtuales y servidores sin tarjeta gráfica.
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std", "parking_lot"] }
# Para leer del registro de Windows si el sistema está en modo oscuro.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[build-dependencies]
# Icono y datos del ejecutable de Windows.
winresource = "0.1"

[dev-dependencies]
# Hash NT para el SAM del servidor RDP de pruebas.
md4 = "0.11"
tempfile = "3"

[features]
default = ["rdp-integrado"]
# Cliente RDP integrado en una pestaña. Sin él, RDP se abre siempre con el
# cliente externo del sistema.
rdp-integrado = [
    "dep:ironrdp-cliprdr",
    "dep:ironrdp-connector",
    "dep:ironrdp-core",
    "dep:ironrdp-graphics",
    "dep:ironrdp-pdu",
    "dep:ironrdp-session",
    "dep:ironrdp-svc",
    "dep:ironrdp-tokio",
    "dep:libz-sys",
    "dep:tokio-rustls",
    "dep:x509-cert",
]
# Solo para pruebas: permite EFRAME_SCREENSHOT_TO=archivo.png
screenshot = ["eframe/__screenshot"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Dependencias optimizadas también en desarrollo (Argon2 y el dibujo lo agradecen).
[profile.dev.package."*"]
opt-level = 2
