[package]
name = "godremote"
version = "0.4.0"
edition = "2024"
description = "Gestor de conexiones remotas (SSH, SFTP, RDP) con árbol de equipos y baúl de credenciales"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
des = "0.9.0"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.11"
# Cliente RDP integrado (IronRDP, Rust puro) con TLS de rustls.
ironrdp-cliprdr = "0.9"
ironrdp-connector = "0.12"
ironrdp-core = "0.3"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-session = "0.13"
ironrdp-svc = "0.10"
ironrdp-tokio = "0.12"
# zlib enlazada estáticamente: `winscard` (vía sspi) la exige y no queremos
# depender de la libz del sistema.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
libz-sys = { version = "1", default-features = false, features = ["static"] }
portable-pty = "0.9"
rand = "0.10"
rfd = "0.18.0"
# OJO: con IronRDP en el árbol, Cargo resuelve russh 0.65.1 (y ssh-key rc.11)
# en lugar de la 0.65.4. sspi y picky, de los que depende ironrdp-connector,
# fijan `rsa = "=0.10.0-rc.18"` y `pkcs1 = "=0.8.0-rc.4"`, mientras que russh
# desde la 0.65.2 exige las versiones finales (rsa 0.10.0), y Cargo no admite
# las dos a la vez. Se pierden así los endurecimientos del cliente SSH de
# russh 0.65.2–0.65.4. En cuanto sspi/picky publiquen versiones sin esa
# fijación bastará con `cargo update -p russh`.
russh = "0.65"
russh-sftp = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
sha2 = "0.11.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.18"
x509-cert = { version = "0.3", default-features = false, features = ["std", "hazmat"] }
zeroize = "1"

[dev-dependencies]
# Hash NT para el SAM del servidor RDP de pruebas.
md4 = "0.11"
tempfile = "3"

[features]
# Solo para pruebas: permite EFRAME_SCREENSHOT_TO=archivo.png
screenshot = ["eframe/__screenshot"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Dependencias optimizadas también en desarrollo (Argon2 y el dibujo lo agradecen).
[profile.dev.package."*"]
opt-level = 2
